[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "romanized-nepali-nlp"
version = "0.1.0"
description = "NLP toolkit for Romanized Nepali text: tokenization, normalization, and sentiment baseline"
readme = "README.md"
authors = [{ name = "NLP Team" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.2.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]
ml = [
    "scikit-learn>=1.2.0",
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
]

[project.scripts]
romanized-nepali = "romanized_nepali_nlp.cli:main"

[tool.setuptools.package-data]
romanized_nepali_nlp = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
